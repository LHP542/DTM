name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bei neuen Pushes alte Runs auf demselben Ref abbrechen — spart Minuten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      # external/FOC-SQL ist ein Dev-Submodul und wird zur Laufzeit/zum Build
      # nicht referenziert -> kein submodules: true noetig.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: NuGet-Cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Key hängt an der zentralen Paketliste (CPM): ändert sich die
          # Directory.Packages.props, wird ein neuer Cache aufgebaut.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build DTM (Release)
        run: dotnet build DTM.slnx -c Release

      - name: Tests ausfuehren
        run: >
          dotnet test DTM.Tests/DTM.Tests.csproj --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Ohne diesen Schritt steht bei einem roten Lauf nur "Process completed
      # with exit code 1" in der Job-Zusammenfassung — die eigentliche
      # Fehlermeldung liegt im Job-Log, und das laesst sich ueber die API nur
      # mit Admin-Rechten am Repo herunterladen. Wer den Fehler ohne
      # Browser-Zugriff nachvollziehen will (kein gh auf dem Arbeitslaptop),
      # steht sonst vor einer Wand. ::error:: landet dagegen als Annotation
      # und ist ueber die oeffentliche API lesbar.
      - name: Fehlgeschlagene Tests als Annotation ausgeben
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for trx in TestResults/*.trx; do
            found=1
            python3 - "$trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse(sys.argv[1]).getroot()
          for r in root.findall(".//t:UnitTestResult", ns):
              if r.get("outcome") != "Failed":
                  continue
              name = r.get("testName", "?")
              msg = r.findtext(".//t:Message", default="", namespaces=ns).strip()
              trace = r.findtext(".//t:StackTrace", default="", namespaces=ns).strip()
              first_frame = next((l.strip() for l in trace.splitlines() if l.strip()), "")
              # Zeilenumbrueche escapen, sonst bricht die Annotation nach der
              # ersten Zeile ab.
              body = f"{msg}\n{first_frame}".replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name}::{body}")
          PY
          done
          if [ "$found" = "0" ]; then
            echo "::error::Keine .trx-Datei gefunden — der Testlauf ist vor dem Schreiben der Ergebnisse abgebrochen."
          fi
