name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bei neuen Pushes alte Runs auf demselben Ref abbrechen — spart Minuten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      # external/FOC-SQL ist ein Dev-Submodul und wird zur Laufzeit/zum Build
      # nicht referenziert -> kein submodules: true noetig.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: NuGet-Cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Key hängt an der zentralen Paketliste (CPM): ändert sich die
          # Directory.Packages.props, wird ein neuer Cache aufgebaut.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build DTM (Release)
        run: dotnet build DTM.csproj -c Release

      - name: Tests ausfuehren
        run: dotnet test DTM.Tests/DTM.Tests.csproj --logger "console;verbosity=normal"
